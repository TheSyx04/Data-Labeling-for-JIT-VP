[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulguard-lite-replication"
version = "0.1.0"
description = "Training-only replication package for VulGuard Lite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.21",
  "pandas>=1.3",
  "scikit-learn>=1.0",
  "imbalanced-learn>=0.9",
  "tqdm>=4.64",
  "torch>=1.13",
  "transformers",
  "huggingface_hub>=0.23",
]

[project.scripts]
vulguard-train = "vulguard_lite.train_cli:main"

[tool.setuptools.packages.find]
include = ["vulguard_lite*"]

[tool.setuptools.package-data]
vulguard_lite = ["models/*/hyperparameters.json"]

